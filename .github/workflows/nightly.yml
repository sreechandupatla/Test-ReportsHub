name: Nightly tests
run-name: Nightly run · ${{ github.event_name }}

# Discovers every project that has specs, runs each project in a parallel matrix job,
# uploads per-project reports as artifacts, then a final commit job collects them all,
# rebuilds the hub dashboards, and pushes a single commit.
on:
  schedule:
    # 00:00 UTC = 02:00 SAST every night.
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # ── 1. Discover which projects have specs ────────────────────────────────────
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_specs: ${{ steps.set-matrix.outputs.has_specs }}
    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        run: |
          PROJECTS=$(find projects -name '*.spec.ts' -path '*/test-plans/*' 2>/dev/null \
            | sed 's|projects/\([^/]*\)/.*|\1|' | sort -u)
          if [ -z "$PROJECTS" ]; then
            echo 'matrix={"project":[]}' >> $GITHUB_OUTPUT
            echo 'has_specs=false' >> $GITHUB_OUTPUT
            echo "::warning::No specs found under projects/*/test-plans/. Nothing to run."
          else
            MATRIX=$(printf '%s\n' $PROJECTS | jq -R -s -c '{project:(split("\n")|map(select(.!="")))}')
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
            echo 'has_specs=true' >> $GITHUB_OUTPUT
          fi

  # ── 2. Run one job per project in parallel ───────────────────────────────────
  test:
    needs: discover
    if: needs.discover.outputs.has_specs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm install --no-save --no-package-lock @playwright/test@^1.49
          npx playwright install chromium --with-deps

      - name: Write CI Playwright config
        run: |
          cat > playwright.config.ci.ts <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: '.',
            fullyParallel: true,
            workers: 3,
            timeout: 90_000,
            reporter: [
              ['list'],
              ['json',  { outputFile: 'ci-results/results.json' }],
              ['junit', { outputFile: 'ci-results/junit.xml' }],
            ],
            use: {
              screenshot: 'only-on-failure',
              trace: 'retain-on-failure',
              video: 'retain-on-failure',
            },
            outputDir: 'ci-results/artifacts',
          });
          EOF

      - name: Run specs for ${{ matrix.project }}
        run: |
          set +e
          TODAY=$(date -u +%Y-%m-%d)
          STAMP=$(date -u +%Y-%m-%dT%H:%MZ)
          PASS=0
          FAIL=0
          ROWS=""
          PROJECT="${{ matrix.project }}"
          PROJ_DIR="projects/$PROJECT"

          # Clean stale allure results so each nightly run starts with a fresh slate
          rm -rf "$PROJ_DIR/allure-results"

          mapfile -t SPECS < <(find "$PROJ_DIR" -name '*.spec.ts' -path '*/test-plans/*' | sort)
          if [ ${#SPECS[@]} -eq 0 ]; then
            echo "::warning::No specs found for project $PROJECT. Nothing to run."
            exit 0
          fi

          for SPEC in "${SPECS[@]}"; do
            REL=${SPEC#projects/}
            REST=${REL#$PROJECT/}
            PLAN=${REST%.spec.ts}.md
            PLAN_BASE=$(basename "$PLAN" .md)

            echo "::group::$PROJECT / $PLAN"
            rm -rf ci-results
            npx playwright test "$SPEC" --config=playwright.config.ci.ts
            RC=$?
            if [ $RC -eq 0 ]; then
              RESULT=PASSED
              PASS=$((PASS+1))
            else
              RESULT=FAILED
              FAIL=$((FAIL+1))
            fi

            DURATION=""
            if [ -f ci-results/results.json ]; then
              DURATION=$(node -e "const r=require('./ci-results/results.json'); const d=Math.round((r.stats?.duration||0)/100)/10; console.log(d+'s');" 2>/dev/null || echo '')
            fi

            mkdir -p "$PROJ_DIR/test-reports/$TODAY"
            {
              echo "# Report: $PLAN_BASE"
              echo ""
              echo "**Date:** $STAMP"
              echo "**Plan:** $PLAN"
              echo "**Spec:** $SPEC"
              echo "**Execution Mode:** ci-nightly"
              echo "**Result:** $RESULT"
              echo "**Duration:** ${DURATION:-unknown}"
              echo "**Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo ""
              echo "_Triggered by the nightly schedule._"
            } > "$PROJ_DIR/test-reports/$TODAY/$PLAN_BASE.md"

            ROWS="${ROWS}- ${RESULT} · \`${PROJECT}\` / \`${PLAN_BASE}\` (${DURATION:-?})\n"
            echo "::endgroup::"
          done

          {
            echo "## $PROJECT — $TODAY"
            echo ""
            echo "**Passed:** $PASS · **Failed:** $FAIL · **Total:** ${#SPECS[@]}"
            echo ""
            echo -e "$ROWS"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.project }}
          path: projects/${{ matrix.project }}/test-reports/
          if-no-files-found: ignore

  # ── 3. Collect reports, rebuild dashboards, commit ───────────────────────────
  commit:
    needs: [discover, test]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install hub dependencies
        run: npm install --no-save --no-package-lock

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          merge-multiple: false
          path: downloaded-reports/
        continue-on-error: true

      - name: Place reports into project directories
        run: |
          for dir in downloaded-reports/reports-*/; do
            [ -d "$dir" ] || continue
            PROJECT="${dir#downloaded-reports/reports-}"
            PROJECT="${PROJECT%/}"
            mkdir -p "projects/$PROJECT/test-reports"
            cp -r "$dir/." "projects/$PROJECT/test-reports/"
          done

      - name: Rebuild hub dashboards
        if: always()
        run: node scripts/build-all.js

      - name: Commit and push
        if: always()
        run: |
          git config user.email "ci@boxfusion"
          git config user.name "Boxfusion CI"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci: nightly run $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash || true
            git push
          fi
